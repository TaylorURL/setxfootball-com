      /* Every face is served from this origin, so the first paint waits on one
         connection rather than several. Each is a variable file covering every
         weight the site uses, and renders in its fallback while it arrives. Geist
         is the exception to the one-file rule and ships in two subsets, because the
         extended range carries the accented characters a camper's name can need.

         The `-fallback` families beside them are the system face rescaled to the
         metrics of the web face, so the swap moves no line and shifts no layout. */

        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 100%;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/archivo-variable.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
