         it is drawn. A connection dropped in the first moments of a page load is
         enough to do that, and the file answers normally again by the time
         anyone goes looking for it.

         are. Where the second attempt fails too, the opening state is lifted so
         the page reads unstyled instead of empty: an author !important rule
         outranks a normal inline declaration, so it holds however often the app
         re-renders those elements. -->
